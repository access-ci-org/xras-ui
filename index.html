<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>XRAS User Interface Components</title>
    </head>
    <body>
        <div id="supporting-grants-react"></div>
        <script type="module">
            import { supportingGrants, shadowTarget } from "/src/main.jsx";
            supportingGrants({
                target: shadowTarget(
                    document.getElementById("supporting-grants-react"),
                    {
                        // `?direct` forces Vite's dev server to serve the fully
                        // processed CSS with a `text/css` content type, instead of
                        // the JS-module wrapper it normally uses for stylesheets
                        // pulled into the import graph. Only needed for `npm run dev`;
                        // production builds reference the real dist/tailwind.css asset.
                        stylesheets: ["/src/tailwind.css?direct"],
                    },
                ),
                fundingAgencies: [
                    { id: 1, name: "National Science Foundation", abbr: "NSF" },
                    { id: 2, name: "Department of Energy", abbr: "DOE" },
                ],
                fosTypes: [
                    { id: 1, name: "Computer Science" },
                    { id: 2, name: "Physics" },
                ],
                // initialIncludeSupportingGrants: true,
                initialGrants: [
                    { grant_id: 999, funding_agency_id: 1, grant_number: "607505", is_pending: false,
                        title: "Seeded", pi_name: "Test PI", begin_date: "2024-01-01", end_date: "2025-01-01",
                        primary_fos_type_id: 1, awarded_amount: 1000, awarded_units: "Dollars",
                        program_officer_name: "PO", program_officer_email: "po@nsf.gov", comments: "x" },
                ],
                initialIncludeSupportingGrants: true,
                onSubmit: (grants) => console.log("submitted", grants),
            });
        </script>
    </body>
</html>
